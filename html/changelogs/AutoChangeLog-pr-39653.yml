author: DamianX
delete-after: true
changes:
- bugfix: AIs ejecting the cell of a space heater or air conditioner no longer leave
    it stuck inside the machine.
- bugfix: Air conditioners can be set below 15°C again.
- bugfix: Space heater and air conditioner temperature can no longer be changed while
    the hatch is closed.
- tweak: Space heater and air conditioner cells ejected remotely by silicons or telekinesis,
    or by cyborgs with no free gripper, drop on the machine's tile.
- tweak: Cyborgs can eject space heater and air conditioner cells remotely with a
    module selected.
