author: SECBATON-GRIFFON
delete-after: true
changes:
- rscadd: Clown, mime, ghost, ass, donut, robo and spell burgers can now be made as
    burgers with custom fillings from dough buns!
- rscadd: Ghost burgers can now be eaten by actual ghosts.
- rscadd: Novaflour can now be used to make nova burgers with 1 slice of monkey meat
    with 5 units of nova flour, or as ingredients added to a bun cooked from a dough
    ball (egg on a sack of it) in a microwave.
